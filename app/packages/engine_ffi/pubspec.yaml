name: engine_ffi
description: "Cầu nối LoopCore: bindings ffigen từ engine_api.h, EngineClient, FakeEngineClient, podspec link LoopCore.xcframework."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        # Swift: quyền mic + mở Settings qua MethodChannel (P0-06).
        # Symbol le_* nằm trong LoopCore.xcframework (static), Dart tìm bằng DynamicLibrary.process().
        pluginClass: EngineFfiPlugin
